name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q
      - name: workbook template is up to date
        run: python tools/build_workbook.py --check
      - name: secret scan
        run: python tools/secret_scan.py
      - name: bicep build
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/export.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
      - name: one-click template (infra/azuredeploy.json) is up to date
        run: |
          az bicep build --file infra/azuredeploy.bicep --outfile /tmp/azuredeploy.json
          diff <(python -c "import json;print(json.dumps(json.load(open('/tmp/azuredeploy.json')),indent=1,sort_keys=True))") \
               <(python -c "import json;print(json.dumps(json.load(open('infra/azuredeploy.json')),indent=1,sort_keys=True))") \
            || (echo "infra/azuredeploy.json is out of date: rebuild it from infra/azuredeploy.bicep" && exit 1)
